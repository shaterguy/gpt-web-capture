name: Build GPT Web Capture DEV APK
run-name: GPT Web Capture DEV (${{ github.ref_name }}) #${{ github.run_number }} attempt ${{ github.run_attempt }}

on:
  push:
    branches:
      - 'v*-dev*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DEV_PACKAGE: com.shaterguy.gptwebcapture.dev
  DEV_VERSION_CODE: '1000001'
  DEV_VERSION_NAME: 0.1.0-dev1
  DEV_APP_LABEL: GPT Web Capture DEV
  DEV_DEBUG_NAME: gpt-web-capture-dev-v0.1.0-dev1-debug.apk
  DEV_UNSIGNED_NAME: gpt-web-capture-dev-v0.1.0-dev1-unsigned.apk

concurrency:
  group: gpt-web-capture-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: true

      - name: Static preflight, unit tests, Android test compile, and candidate builds
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --stacktrace \
            :app:testDevDebugUnitTest \
            :app:assembleDevDebug \
            :app:assembleDevRelease \
            :app:assembleDevDebugAndroidTest

      - name: Validate candidate identities before emulator
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          DEBUG_APK="$(find app/build/outputs/apk/dev/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          UNSIGNED_APK="$(find app/build/outputs/apk/dev/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          TEST_APK="$(find app/build/outputs/apk/androidTest/dev/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$DEBUG_APK"
          test -s "$UNSIGNED_APK"
          test -s "$TEST_APK"
          for APK in "$DEBUG_APK" "$UNSIGNED_APK"; do
            BADGING="$($BT/aapt dump badging "$APK")"
            grep -Fq "package: name='$DEV_PACKAGE'" <<<"$BADGING"
            grep -Fq "versionCode='$DEV_VERSION_CODE'" <<<"$BADGING"
            grep -Fq "versionName='$DEV_VERSION_NAME'" <<<"$BADGING"
            grep -Fq "application-label:'$DEV_APP_LABEL'" <<<"$BADGING"
            unzip -t "$APK" >/dev/null
            PERMS="$($BT/aapt dump permissions "$APK" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort)"
            EXPECTED="$(printf '%s\n' android.permission.ACCESS_NETWORK_STATE android.permission.INTERNET | sort)"
            [[ "$PERMS" == "$EXPECTED" ]]
          done
          "$BT/apksigner" verify --verbose --print-certs "$DEBUG_APK" > debug-cert.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' debug-cert.txt

      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Run WebView capture runtime regression
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: gradle --no-daemon --console=plain --stacktrace :app:connectedDevDebugAndroidTest

      - name: Package verified DEV artifacts
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/dev/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          UNSIGNED_APK="$(find app/build/outputs/apk/dev/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          rm -rf dev-debug dev-unsigned
          mkdir -p dev-debug dev-unsigned
          cp "$DEBUG_APK" "dev-debug/$DEV_DEBUG_NAME"
          cp "$UNSIGNED_APK" "dev-unsigned/$DEV_UNSIGNED_NAME"
          (
            cd dev-debug
            sha256sum "$DEV_DEBUG_NAME" > SHA256SUMS.txt
            printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
            printf '%s\n' "$GITHUB_RUN_ATTEMPT" > SOURCE_RUN_ATTEMPT.txt
          )
          (
            cd dev-unsigned
            sha256sum "$DEV_UNSIGNED_NAME" > UNSIGNED_SHA256SUMS.txt
            printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
          )

      - name: Upload installable DEV debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt-web-capture-dev-${{ env.DEV_VERSION_NAME }}-debug-attempt-${{ github.run_attempt }}
          path: dev-debug/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload unsigned persistent-signing input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt-web-capture-dev-${{ env.DEV_VERSION_NAME }}-unsigned-attempt-${{ github.run_attempt }}
          path: dev-unsigned/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt-web-capture-dev-${{ env.DEV_VERSION_NAME }}-test-reports-attempt-${{ github.run_attempt }}
          path: |
            app/build/test-results/testDevDebugUnitTest/**
            app/build/reports/tests/testDevDebugUnitTest/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 7
