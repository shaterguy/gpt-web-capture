plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaterguy.gptwebcapture'
    compileSdk 36

    defaultConfig {
        applicationId 'com.shaterguy.gptwebcapture'
        minSdk 28
        targetSdk 36
        versionCode 1000001
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions += 'channel'
    productFlavors {
        stable {
            dimension 'channel'
            manifestPlaceholders = [appLabel: 'GPT Web Capture']
            buildConfigField 'boolean', 'WEB_CONTENT_DEBUGGING', 'false'
        }
        dev {
            dimension 'channel'
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev1'
            manifestPlaceholders = [appLabel: 'GPT Web Capture DEV']
            buildConfigField 'boolean', 'WEB_CONTENT_DEBUGGING', 'true'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
